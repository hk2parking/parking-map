<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>東郡山2丁目駐車場 | 東郡山2丁目駐車場 詳細</title>

  <style>
    body { font-family: sans-serif; margin: 20px; }

    /* 2枚の画像を横並びにする枠 */
    .photo-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 30px;
    }

    /* 左画像（高さを揃えたい場合はこちらは固定OK） */
    .left-photo {
      width: 50%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      object-fit: cover;
      height: 350px;
    }

    /* 右の kukaku（全体表示 最優先） */
    .right-photo {
      width: 50%;        /* 横幅だけ50%に制限 */
      height: auto;      /* ← 最重要：絶対に固定しない */
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* スマホ時：縦並び＋全体表示 */
    @media (max-width: 700px) {
      .photo-row {
        flex-direction: column;
      }
      .left-photo, .right-photo {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
    }
  </style>

</head>

<body>

  <h2>写真と区画図</h2>

  <div class="photo-row">
    <!-- 左の写真 -->
    <img src="zenkei.jpg" class="left-photo" alt="全景">

    <!-- 右の kukaku 写真（絶対に切れない） -->
    <img src="kukaku.jpg" class="right-photo" alt="区画図">
  </div>

</body>
</html>
