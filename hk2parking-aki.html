<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>東郡山2丁目駐車場 空き状況</title>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      margin: 40px;
    }

    /* 上部タイトル（青＋白文字） */
    .header-title {
      width: 100%;
      background-color: #007bff; /* 青 */
      color: white;              /* 白文字 */
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      padding: 20px 0;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .parking-container {
      display: flex;
      align-items: flex-start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ボタン */
    .spot-btn {
      width: 150px;
      height: 60px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .spot-btn:hover {
      opacity: 0.8;
    }

    /* 空き：FLASH 点滅 */
    .free {
      background-color: #2ecc71;
      animation: flashFree 0.8s infinite alternate;
    }
