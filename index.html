  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;

    nav {
      background-color: #007bff;
      color: white;

      font-weight: bold;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* 空き有ラベル */
    .flash-box {
      background: #ff5050;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      animation: flashBox 0.6s infinite alternate;
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }

    @keyframes flashBox {
      from { opacity: 0.5; }
      to   { opacity: 1; }
    }

    #map {
      width: 100%;
      height: 480px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    /* 涙型ピン */
    .pin-drop {
      width: 26px;
      height: 26px;
      background: #ff0000;
      border-radius: 50% 50% 50% 0;
      position: absolute;
      transform: rotate(-45deg);
      left: -13px;
      top: -26px;
      border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(255,0,0,0.8);
      animation: pinFlash 0.9s infinite alternate ease-in-out;
    }

    .pin-drop::after {
      content: "";
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 7px;
      left: 7px;
    }

    @keyframes pinFlash {
      0% { transform: rotate(-45deg) scale(1); }
      100% { transform: rotate(-45deg) scale(1.25); }
    }
  </style>
</head>


<body>
  <nav>東郡山2丁目駐車場(月極)</nav>

  <main>
    <div class="flash-box" onclick="location.href='hk2parking-aki.html'">
      空き有
    </div>

    <h1>太白区 東郡山2丁目 月極駐車場</h1>

    <div id="map"></div>

  </main>

  <script>
  async function initMap() {
    const { Map } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

    const map = new Map(document.getElementById("map"), {
      center: { lat: 38.221612, lng: 140.900544 },
      zoom: 17
    });

    const infoWindow = new google.maps.InfoWindow();

    // PC / スマホ判定
    const isMobile = /iPhone|Android/i.test(navigator.userAgent);

    // CSV 読み込み
    const res = await fetch("parkings.csv");
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(",");

      const name = cols[0]?.trim();
      const lat = parseFloat(cols[1]);
      const lng = parseFloat(cols[2]);
      const url = cols[3]?.trim() || "#";

      if (isNaN(lat) || isNaN(lng)) continue;

      const pin = document.createElement("div");
      pin.className = "pin-drop";

      const marker = new AdvancedMarkerElement({
        map,
        position: { lat, lng },
        title: name,
        content: pin
      });

      const showPopup = () => {
        infoWindow.setContent(`
          <div style="max-width:220px;">
            <img src="thumbnail.jpg" style="width:100%; border-radius:6px;">
            <strong>${name}</strong><br>
            月額6600円・防犯カメラ24h<br>
            <a href="${url}" target="_blank">詳細を見る</a>
          </div>
        `);
        infoWindow.open(map, marker);
      };

      if (isMobile) {
        marker.addListener("click", showPopup);
      } else {
        marker.addListener("mouseenter", showPopup);
        marker.addListener("mouseleave", () => infoWindow.close());
      }
    }
  }

  window.initMap = initMap;
  </script>

  <!-- Google Maps API -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCvMlZ7Q2VqRug6A5k8dCNax7ODFDiBRJc&callback=initMap">
  </script>

</body>
