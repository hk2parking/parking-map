<body>
  <nav>東郡山2丁目駐車場(月極駐車場)</nav>

  <main>
    <h1>太白区 東郡山2丁目 月極駐車場</h1>

    <div class="flash-box" onclick="window.location.href='https://hk2parking.github.io/parking-map/hk2parking-aki.html'">
      空き有
    </div>

    <!-- 左右に地図とストリートビュー -->
    <div class="map-street-container">
      <div id="map"></div>
      <div id="street-view"></div>
    </div>

    <p>空き有ボタンで空き状況を確認できます。</p>

    <h2>駐車場の特徴</h2>
    <ul>
      <li>月額6600円</li>
      <li>防犯カメラが24時間AI監視で2台目の保管にも安心</li>
      <li>フェンスで囲まれセキュリティ度高い</li>
      <li>アルファード等大型乗用車OK</li>
      <li>大型バイク屋根応相談</li>
      <li>24時間出入り可能</li>
      <li>月極</li>
      <li>短期契約応相談</li>
    </ul>

    <h2>近隣エリアの月極駐車場</h2>
    <ul>
      <li><a href="#">郡山3丁目 月極駐車場</a></li>
      <li><a href="#">郡山4丁目 月極駐車場</a></li>
      <li><a href="#">八本松 月極駐車場</a></li>
      <li><a href="#">鹿又交差点 周辺駐車場</a></li>
    </ul>
  </main>

  <script>
    async function initMap() {
      const { Map, StreetViewPanorama } = await google.maps.importLibrary("maps");
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new Map(document.getElementById("map"), {
        center: { lat: 38.221612, lng: 140.900544 },
        zoom: 17,
        mapId: "DEMO_MAP_ID"
      });

      const streetView = new StreetViewPanorama(
        document.getElementById("street-view"),
        {
          position: { lat: 38.221612, lng: 140.900544 },
          pov: { heading: 34, pitch: 10 },
          zoom: 1
        }
      );

      map.setStreetView(streetView);

      const infoWindow = new google.maps.InfoWindow();
      const bounds = new google.maps.LatLngBounds();

      try {
        const res = await fetch('parkings.csv');
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',');
          const name = cols[0]?.trim() || ('NoName-' + i);
          const lat = parseFloat(cols[1]);
          const lng = parseFloat(cols[2]);
          const url = cols[3]?.trim() || '#';
          const status = cols[4]?.trim().toLowerCase();

          if (isNaN(lat) || isNaN(lng)) continue;

          const pinDiv = document.createElement("div");
          pinDiv.className = "pin-drop";

          const marker = new AdvancedMarkerElement({
            map,
            position: { lat, lng },
            title: name,
            content: pinDiv
          });

          marker.addListener("click", () => {
            infoWindow.setContent(`<strong>${name}</strong><br>` +
              (url !== '#' ? `<a href="${url}" target="_blank" rel="noopener">詳細を見る</a>` : ''));
            infoWindow.open(map, marker);
          });

          bounds.extend({ lat, lng });
        }

        if (!bounds.isEmpty()) {
          map.fitBounds(bounds);
          google.maps.event.addListenerOnce(map, 'bounds_changed', () => {
            map.setZoom(17);
          });
        }
      } catch (err) {
        console.error("CSVの読み込みエラー:", err);
      }
    }

    window.initMap = initMap;
  </script>
