<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>東郡山2丁目駐車場 | 仙台市太白区 月極駐車場</title>
<style>
  body { margin: 0; font-family: "Segoe UI", sans-serif; }
  nav {
    background-color: #007bff;
    color: white;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  main { padding: 16px; }
  .flash-box {
    background: #ff5050;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    display: inline-block;
    animation: flashBox 0.6s infinite alternate;
    cursor: pointer;
    margin-bottom: 12px;
  }
  @keyframes flashBox {
    from { opacity: 0.3; box-shadow: 0 0 4px #ff0000; }
    to   { opacity: 1; box-shadow: 0 0 16px #ff0000; }
  }
  .map-street-container {
    display: flex;
    gap: 16px;
  }
  #map, #street-view {
    flex: 1 1 48%;
    height: 480px;
  }
</style>
</head>
<body>
  <nav>東郡山2丁目駐車場(月極駐車場)</nav>
  <main>
    <h1>太白区 東郡山2丁目 月極駐車場</h1>
    <div class="flash-box" onclick="window.location.href='https://hk2parking.github.io/parking-map/hk2parking-aki.html'">空き有</div>
    <div class="map-street-container">
      <div id="map"></div>
      <div id="street-view"></div>
    </div>
  </main>

  <script>
    let greenMarkers = [];
    let pulseStep = 0;
    let pulseDirection = 1;

    function initMap() {
      const center = { lat: 38.221612, lng: 140.900544 };
      const offsetLat = 0.00005; // 緑マーカーを少し上にずらす

      // 地図
      const map = new google.maps.Map(document.getElementById("map"), {
        center,
        zoom: 17
      });

      // ストリートビュー
      const panorama = new google.maps.StreetViewPanorama(
        document.getElementById("street-view"),
        { position: center, pov: { heading: 34, pitch: 10 }, zoom: 1 }
      );
      map.setStreetView(panorama);

      // CSVからマーカー生成
      fetch('parkings.csv')
        .then(res => res.text())
        .then(text => {
          const lines = text.trim().split(/\r?\n/);
          for(let i=1; i<lines.length; i++){
            const cols = lines[i].split(',');
            const name = cols[0]?.trim() || 'NoName-' + i;
            let lat = parseFloat(cols[1]);
            const lng = parseFloat(cols[2]);
            const url = cols[3]?.trim() || '#';
            const status = cols[4]?.trim().toLowerCase();
            if(isNaN(lat)||isNaN(lng)) continue;

            const color = status==='taken'?'red':'green';
            if(color==='green') lat += offsetLat; // 上にずらす

            const marker = new google.maps.Marker({
              position: { lat, lng },
              map,
              title: name,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: color,
                fillOpacity: 1,
                strokeWeight: 2,
                strokeColor: '#fff'
              }
            });

            if(color==='green') greenMarkers.push(marker);

            const infowindow = new google.maps.InfoWindow();
            marker.addListener('click', () => {
              infowindow.setContent(`<strong>${name}</strong><br>` + 
                (url!=='#'?`<a href="${url}" target="_blank">詳細を見る</a>`:''));
              infowindow.open(map, marker);
            });
          }
        })
        .catch(err => console.error(err));

      // 緑マーカーの点滅アニメーション
      setInterval(() => {
        pulseStep += pulseDirection * 0.3;
        if(pulseStep > 4 || pulseStep < 0) pulseDirection *= -1;
        greenMarkers.forEach(m => {
          const icon = m.getIcon();
          icon.scale = 10 + pulseStep;
          m.setIcon(icon);
        });
      }, 100);
    }
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
  </script>
</body>
</html>
